<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenieAi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  /* GenieAi: one dark crimson world, taken from the project mockups. Sidebar app shell, content in cards. */
  --bg:#0e0a0c;
  --panel:#171114;
  --panel-2:#20171c;
  --line:#33252c;
  --text:#f5eef1;
  --muted:#a9959e;
  --accent:#de3561;
  --accent-deep:#8f1239;
  --good:#47c486;
  --warn:#e8a93f;
  --font-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --font-body:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:600}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons, inputs, chips ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);padding:9px 14px;border-radius:10px;font-weight:500;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:#4a3540;background:#281d23}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#ef4570}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:90px}
.input-icon{position:relative}
.input-icon .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input-icon .input{padding-left:38px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:#2a5a40;background:#132a1f}
.pill.warn{color:var(--warn);border-color:#5e4520;background:#2a1f10}
.pill.accent{color:#ff9db6;border-color:#5c2034;background:#2b1019}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent);color:#fff}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:48px;padding:48px clamp(16px,6vw,96px);
  background:radial-gradient(900px 500px at 15% 30%,rgba(222,53,97,.22),transparent 60%),radial-gradient(700px 500px at 90% 90%,rgba(143,18,57,.25),transparent 60%),var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px}
.brand b{color:var(--accent);font-weight:700}
.login .brand{font-size:clamp(40px,6vw,64px);gap:14px}
.login-copy{display:flex;flex-direction:column;gap:22px;max-width:560px}
.login-copy .lead{font-size:20px;font-family:var(--font-display);font-weight:500}
.login-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:12px;border-top:1px solid var(--line);padding-top:22px}
.login-feats div{display:flex;flex-direction:column;gap:6px;padding-right:14px;font-size:13px}
.login-feats div+div{border-left:1px solid var(--line);padding-left:14px}
.login-feats strong{font-size:14px}
.login-card{background:rgba(23,17,20,.88);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px;max-width:420px;width:100%;justify-self:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-card h2{text-align:center;font-size:20px}
.demo-note{font-size:12px;color:var(--muted);text-align:center}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:minmax(0,1fr);height:100%}
.side{background:#120d10;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.side .brand{padding:4px 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a.on{background:var(--accent);color:#fff}
.nav .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;flex:none}
.who .meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who .meta span:last-child{font-size:12px;color:var(--muted)}
.main{overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,10,12,.92);backdrop-filter:blur(8px);z-index:5}
.topbar .crumb{font-size:13px;color:var(--muted)}
.topbar .spacer{flex:1}
.menu-btn{display:none}
.view{padding:26px 28px 40px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.view-head .sub{color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.6fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.demo-banner{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* hero course card */
.course-hero{position:relative;overflow:hidden;border-radius:var(--r);padding:24px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:1px solid #4d1a2c;cursor:pointer;text-align:left;color:var(--text);
  background:radial-gradient(400px 220px at 85% 0%,rgba(255,90,130,.45),transparent 70%),linear-gradient(135deg,#3b0f20 0%,#1c0c13 60%,#170f13 100%)}
.course-hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.course-hero > *:not(canvas){position:relative}
.course-hero h2{font-size:24px}
.course-hero .go{position:absolute;right:18px;bottom:18px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}

.checklist{display:flex;flex-direction:column;gap:4px}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;cursor:pointer}
.check-row:hover{background:var(--panel-2)}
.check-row input{appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;margin:2px 0 0;flex:none;display:grid;place-items:center;cursor:pointer}
.check-row input:checked{background:var(--accent);border-color:var(--accent)}
.check-row input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.check-row.done .t{text-decoration:line-through;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:13px;font-weight:500;text-align:center;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .ic{color:var(--accent)}

.stat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;text-align:center}
.stat .ic{color:var(--accent);margin-bottom:4px}
.stat .n{font-family:var(--font-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:500}
.row-btn{background:none;border:0;width:100%;text-align:left;border-radius:10px;padding:12px 8px}
.row-btn:hover{background:var(--panel-2)}
.file-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#2b1019;color:#ff8aa8;flex:none}
.file-ic.video{background:#2a1424;color:#ff7aa0}

/* ---------- chat ---------- */
.chat-wrap{display:flex;flex-direction:column;min-height:0;flex:1 1 0;padding:0}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 28px 14px;flex-wrap:wrap}
.chat-scroll{flex:1;overflow-y:auto;padding:8px 28px 20px;display:flex;flex-direction:column;gap:18px;min-height:0}
.msg{display:flex;gap:12px;max-width:820px}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.6;max-width:680px}
.msg.user .bubble{background:var(--accent-deep);border-color:#a8194a}
.bubble ul{margin:6px 0;padding-left:20px}
.bubble p+p,.bubble p+ul,.bubble ul+p{margin-top:8px}
.bubble sup{font-size:10px;color:#ff9db6;font-weight:600;margin-left:1px}
.bot-ic{width:32px;height:32px;border-radius:10px;background:#2b1019;display:grid;place-items:center;color:var(--accent);flex:none}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);cursor:pointer}
.src:hover{border-color:var(--accent)}
.suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 28px 10px}
.suggest button{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.suggest button:hover{border-color:var(--accent)}
.composer{display:flex;gap:10px;align-items:flex-end;margin:0 28px 22px;padding:8px 8px 8px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.composer textarea{flex:1;background:none;border:0;outline:none;resize:none;padding:8px 0;max-height:160px;min-height:24px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- misc components ---------- */
.qa-item{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.qa-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.qa-meta .spacer{flex:1}
.answer{border-left:2px solid var(--accent);padding:4px 0 4px 12px;font-size:14px}
.answer .by{font-size:12px;color:var(--muted);margin-bottom:2px}
.summary-card{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.summary-card > button{display:flex;gap:14px;align-items:center;padding:16px 18px;background:none;border:0;text-align:left;width:100%}
.summary-card > button:hover{background:var(--panel-2)}
.summary-body{padding:0 18px 18px 72px;display:flex;flex-direction:column;gap:12px}
.summary-body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chev{transition:transform .2s;color:var(--muted)}
.open .chev{transform:rotate(90deg)}
.code-box{font-family:var(--font-display);font-size:44px;letter-spacing:.18em;font-weight:600;text-align:center;padding:22px;border-radius:14px;border:2px dashed var(--accent);background:#1d0d14}
.code-input{text-transform:uppercase;letter-spacing:.3em;font-size:22px;text-align:center;font-family:var(--font-display)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:170px 1fr 44px;align-items:center;gap:12px;padding:7px 0}
.bar{height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar > i.soft{background:#6a3a4b}
.tool{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px;text-align:center;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.tool:hover{border-color:var(--accent)}
.tool .ic{color:var(--accent);margin-bottom:4px}
.tool strong{font-size:14px}
.tool span{font-size:12.5px;color:var(--muted)}
.week-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.week-row:first-child{border-top:0}
.week-row.current{background:#1f0d15;border-radius:10px;border-top-color:transparent;padding-left:10px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* modal, toast, popover */
.scrim{position:fixed;inset:0;background:rgba(6,3,5,.7);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.page-block{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.page-block.hit{border-color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b1019;border:1px solid #6a2240;color:var(--text);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pop{position:absolute;right:28px;top:60px;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pop .row{padding:10px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);position:absolute;top:7px;right:7px}

@media (max-width:1020px){
  .g2,.g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  .menu-btn{display:inline-grid}
  .login{grid-template-columns:1fr;gap:28px;padding-top:36px}
  .login-feats{grid-template-columns:1fr;gap:12px}
  .login-feats div+div{border-left:0;padding-left:0}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .view,.chat-head,.chat-scroll{padding-left:16px;padding-right:16px}
  .composer{margin-left:16px;margin-right:16px}
  .suggest{padding-left:16px;padding-right:16px}
  .topbar{padding:12px 16px}
  .summary-body{padding-left:18px}
  .bar-row{grid-template-columns:110px 1fr 36px}
  .pop{right:12px;left:12px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ======================= icons ======================= */
const ICONS={
  spark:'<path d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4L3.5 11l6.4-2.1z"/><path d="M19 17l.7 2.1 2.1.7-2.1.7L19 22.6l-.7-2.1-2.1-.7 2.1-.7z"/>',

  book:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  library:'<path d="M4 4h4v16H4z"/><path d="M10 4h4v16h-4z"/><path d="M16.5 5.2l3.4-.9 3.1 15.5-3.4.9z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/><path d="M9 15.5l2 2 4-4"/>',
  question:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/><path d="M9.8 9.3a2.3 2.3 0 0 1 4.4.8c0 1.5-2.2 2-2.2 2"/><path d="M12 15.2h.01"/>',
  tools:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  chart:'<path d="M3 21h18"/><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  video:'<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M10 9l5 3-5 3z"/>',

  {p:1,t:'Generative AI (BASCii) is a practical course on how generative models work and how to build with them: large language models, embeddings, prompt engineering, retrieval-augmented generation and real-world applications. Classes meet on Fridays from 13:00 to 16:00 in Room 1104.'},

 {id:'w1',kind:'slides',week:1,type:'PDF',title:'Lecture Slides – Week 1: Introduction to GenAI',file:'Lecture_Week1_Intro.pdf',size:'8.4 MB',date:'2026-10-08',pages:[
  {p:3,t:'Generative AI refers to models that create new content such as text, images, audio and code by learning the patterns in their training data. Discriminative models learn to classify or label inputs, while generative models learn the data distribution and sample new examples from it.'},
  {p:6,t:'Major model families: autoregressive language models (GPT-style) that predict the next token, diffusion models that generate images by gradually removing noise, GANs with a generator and a discriminator, and variational autoencoders (VAEs).'}]},
 {id:'w2',kind:'slides',week:2,type:'PDF',title:'Lecture Slides – Week 2: Large Language Models',file:'Lecture_Week2_LLMs.pdf',size:'7.9 MB',date:'2026-10-15',pages:[
  {p:4,t:'A large language model (LLM) is a transformer trained to predict the next token on a very large text corpus. After pre-training, instruction tuning and RLHF (reinforcement learning from human feedback) teach the model to follow instructions and respond helpfully.'},
  {p:8,t:'Decoding settings: temperature scales the probability distribution over next tokens. Low temperature makes output more focused and repeatable; high temperature makes it more varied. Temperature 0 means greedy decoding, which is close to deterministic, but small differences can still appear because of hardware and batching. Top-p sampling keeps only the smallest set of tokens whose probabilities add up to p.'},
  {p:11,t:'The context window is the maximum number of tokens a model can read at once. Hallucination is when a model produces fluent text that is not supported by facts or by the provided sources; grounding the model in retrieved documents reduces it.'}]},
 {id:'w3',kind:'slides',week:3,type:'PDF',title:'Lecture Slides – Week 3: Tokenization & Embeddings',file:'Lecture_Week3_Embeddings.pdf',size:'6.1 MB',date:'2026-10-22',pages:[
  {p:3,t:'Tokenizers split text into subword units, for example with byte-pair encoding (BPE). In English one token is roughly three quarters of a word; Thai and other languages often need more tokens per word, which affects cost and context length.'},
  {p:7,t:'Embeddings map text to dense vectors so that passages with similar meaning end up close together. Cosine similarity measures the angle between two vectors and is the usual way to compare embeddings.'},
  {p:10,t:'Choosing an embedding model: match the language of your documents (use a multilingual model for mixed Thai and English), weigh vector dimension against storage cost, check the maximum input length against your chunk size, compare scores on the MTEB benchmark, and always test retrieval quality on a sample of your own questions.'}]},
 {id:'w4',kind:'slides',week:4,type:'PDF',title:'Lecture Slides – Week 4: Transformers & Attention',file:'Lecture_Week4_Transformers.pdf',size:'9.0 MB',date:'2026-10-29',pages:[
  {p:5,t:'Self-attention lets every token weigh every other token in the sequence. Each token produces a query, a key and a value; attention weights come from softmax(QKᵀ/√d) and are used to mix the values.'},
  {p:9,t:'Multi-head attention runs several attention operations in parallel so the model can track different relationships. Positional encodings add word-order information. Most modern chat models use a decoder-only transformer.'}]},
 {id:'w5',kind:'slides',week:5,type:'PDF',title:'Lecture Slides – Week 5: LLM Evaluation',file:'Lecture_Week5_Evaluation.pdf',size:'5.3 MB',date:'2026-11-05',pages:[
  {p:4,t:'Automatic metrics such as BLEU and ROUGE measure word overlap with a reference answer, and perplexity measures how well a model predicts text. Overlap metrics miss answers that are correct but worded differently.'},
  {p:8,t:'LLM-as-a-judge uses a strong model with a clear rubric to grade outputs; human evaluation remains the reference point. For RAG systems, evaluate retrieval (does recall@k find the right chunks?) separately from generation (is the answer faithful to the sources and relevant to the question?).'}]},
 {id:'w6',kind:'slides',week:6,type:'PDF',title:'Lecture Slides – Week 6: Prompt Engineering',file:'Lecture_Week6_Prompting.pdf',size:'4.8 MB',date:'2026-11-12',pages:[
  {p:3,t:'Zero-shot prompts give only instructions; few-shot prompts add worked examples. Good prompts state the task, the audience, the format of the answer and any constraints.'},
  {p:7,t:'Chain-of-thought prompting asks the model to reason step by step before answering. Use delimiters to separate instructions from data, request structured output such as JSON when another program will read it, and watch for prompt injection, where text inside the data tries to override your instructions.'}]},
 {id:'w7',kind:'slides',week:7,type:'PDF',title:'Lecture Slides – Week 7: RAG & Vector Databases',file:'Lecture_Week7_RAG.pdf',size:'10.2 MB',date:'2026-11-16',pages:[
  {p:3,t:'RAG (retrieval-augmented generation) retrieves relevant documents at question time and adds them to the prompt, so the model answers from those sources instead of only from what it memorised. Pipeline: load documents, split them into chunks, embed each chunk, store the vectors in a vector database, retrieve the top-k chunks for a question, then generate an answer that cites them.'},
  {p:5,t:'RAG vs fine-tuning: RAG adds knowledge at query time, is easy to update when documents change, and can show its sources. Fine-tuning changes the model weights to adapt its behaviour, style or task format; it needs training data, and knowledge baked into the weights is harder to update. Example: a course chatbot answering from the syllabus and slides should use RAG; making a model always grade in a fixed rubric format is a job for fine-tuning.'},
  {p:8,t:'Chunking: chunks of roughly 300–800 tokens with 10–20% overlap work well for lecture notes. Vector databases such as Chroma, FAISS and pgvector use approximate nearest-neighbour search. Hybrid search combines keyword search (BM25) with vector search and often retrieves better than either alone.'},
  {p:11,t:'A local RAG stack: Ollama runs open models such as Llama 3 or Mistral on your own laptop, nomic-embed-text creates the embeddings, and LangChain or LlamaIndex connects the pipeline. For the RAG Practice assignment you may use Ollama or any hosted API.'}]},

/* ======================= retrieval (client-side RAG) ======================= */
const STOP=new Set('a an the is are was were be been to of and or in on for with how what why when which who whom does do did can could i you it its this that these those from by as at vs versus between difference different me my our we us about use using should would will there their them than then so if not no yes please explain tell give example examples'.split(' '));
const stem=w=>w.length>4?w.replace(/(ings|ing|ed|es|s)$/,''):w;
const toks=s=>(s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w)).map(stem).filter(w=>w.length>1);
function chunks(){const out=[];for(const m of allMaterials()){if(!m.pages)continue;for(const pg of m.pages){out.push({id:m.id,p:pg.p,file:m.file,title:m.title,text:pg.t,tk:toks(m.title+' '+pg.t)})}}return out}
function retrieve(q,k=4){
  let qt=toks(q);const ql=q.toLowerCase();
  if(/\brag\b/.test(ql))qt.push('retrieval','augment');
  if(/fine.?tun/.test(ql))qt.push('fine','tun');
  if(/embed/.test(ql))qt.push('embedd');
  qt=[...new Set(qt)];
  const cs=chunks(),N=cs.length,df={};
  cs.forEach(c=>new Set(c.tk).forEach(t=>df[t]=(df[t]||0)+1));
  cs.forEach(c=>{const tf={};c.tk.forEach(t=>tf[t]=(tf[t]||0)+1);c.score=qt.reduce((s,t)=>s+(tf[t]?(1+Math.log(tf[t]))*(Math.log(N/df[t])+1):0),0)});
  const ranked=cs.filter(c=>c.score>0).sort((a,b)=>b.score-a.score);
  if(!ranked.length)return[];const top=ranked[0].score;
  return ranked.filter(c=>c.score>=top*.35).slice(0,k);
}
function topicOf(q){const l=q.toLowerCase();
  if(/\brag\b|retriev|vector|chunk|chroma|faiss|langchain|ollama/.test(l))return'RAG & Vector DBs';

  if(/evaluat|metric|bleu|rouge|judge/.test(l))return'LLM Evaluation';
  if(/prompt|few.?shot|chain.of.thought|injection/.test(l))return'Prompt Engineering';
  if(/attention|transformer/.test(l))return'Transformers';
  if(/token/.test(l))return'Tokenization';
  return'LLM Basics'}

function drawWave(){const cv=document.getElementById('heroWave');if(!cv)return;const r=cv.getBoundingClientRect();const d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;const g=cv.getContext('2d');g.scale(d,d);

function msgHTML(m,i){
  if(m.role==='user')return `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`;
  const src=(m.sources||[]).map((s,k)=>{const x=mat(s.id);return x?`<button class="src" data-src="${s.id}" data-page="${s.p}">${ic('file',13)}${esc(x.file)} (p. ${s.p})</button>`:''}).join('');
  return `<div class="msg bot"><div class="bot-ic">${ic('spark',18)}</div><div class="bubble">${m.pending&&!m.text?'<span class="typing"><i></i><i></i><i></i></span>':md(m.text)}
    ${src?`<div class="sources"><span class="tiny muted">Sources:</span>${src}</div>`:''}
    ${m.note?`<p class="tiny muted" style="margin-top:8px">${esc(m.note)}</p>`:''}</div></div>`;

after.ask=()=>{
  const sc=document.getElementById('chatScroll');sc.scrollTop=sc.scrollHeight;
  const ta=document.getElementById('chatIn');
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px'};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('composer').requestSubmit()}};
  document.getElementById('composer').onsubmit=e=>{e.preventDefault();const q=ta.value.trim();if(q&&!UI.busy)ask(q)};
  if(!UI.busy)ta.focus({preventScroll:true});
};
async function ask(q){
  if(UI.busy) return;
  UI.busy = true;

  S.chat.push({role:'user',text:q});
  const bot = {role:'bot',text:'',pending:true,sources:[]};
  S.chat.push(bot);
  save();
  render();

  try {
    const messages = S.chat
      .filter(m => !m.pending && (m.role === 'user' || m.role === 'bot'))
      .map(m => ({
        role: m.role === 'bot' ? 'assistant' : 'user',
        content: m.text
      }));

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages})
    });

    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'Chat request failed');

    bot.text = data.message?.content || 'No answer returned.';
    bot.sources = (data.sources || []).map((source, i) => ({
      id: i + 1,
      file: source.filename || 'Uploaded document',
      p: source.location || '',
      text: source.text || ''
    }));
  } catch(err) {
    bot.text = 'Unable to connect to Ollama + RAG: ' + err.message;
    bot.sources = [];
  } finally {
    bot.pending = false;
    UI.busy = false;
    save();
    render();
  }
}
function offlineAnswer(bot,hits){
  const top=hits.slice(0,2);
  bot.text='Here is what your course materials say:\n'+top.map((h,i)=>`- ${h.text} [S${i+1}]`).join('\n');
  bot.sources=top.map(h=>({id:h.id,p:h.p}));
  bot.note='Retrieval-only mode: these are the closest passages. Open a source to read it in full.';
}

VIEWS.qa=()=>{

  list.sort((a,b)=>prof?(!!a.answer-!!b.answer)||b.votes-a.votes:new Date(b.at)-new Date(a.at));

  return `<section class="view"><div class="view-head"><div><h1>Anonymous Q&A</h1><p class="sub">${prof?'Questions from students. Names are never shown, to you or to classmates.':'Ask anything about the course. Your name is never shown, to your professor or to classmates.'}</p></div>
    ${prof?'':`<button class="btn primary" data-act="askq">${ic('plus',16)}Ask a question</button>`}</div>
   <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${UI.qaTab===k?'on':''}" data-qatab="${k}">${l}</button>`).join('')}</div>
   <div class="list" style="gap:12px">${list.length?list.map(q=>`<article class="qa-item">
     <div class="qa-meta">${ic('user',14)}<span>Anonymous${q.mine&&!prof?' (you)':''} · ${rel(q.at)}</span><span class="pill">${esc(q.topic)}</span><span class="spacer"></span>${q.answer?'<span class="pill good">'+ic('check',12)+'Answered</span>':'<span class="pill warn">Waiting for reply</span>'}</div>
     <p style="font-size:15.5px">${esc(q.text)}</p>
     ${q.answer?`<div class="answer"><div class="by">Professor · ${rel(q.answeredAt)}</div>${esc(q.answer)}</div>`:''}
     <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      ${prof?`<span class="small muted">${ic('thumb',14).replace('class="ic"','class="ic" style="display:inline;vertical-align:-2px"')} ${q.votes} students have this question</span>`:`<button class="btn sm ghost" data-vote="${q.id}" ${q.voted?'disabled':''}>${ic('thumb',14)}${q.voted?'You asked this too':'I have this question too'} · ${q.votes}</button>`}

/* ======================= modals & tools ======================= */
function modal(title,body,onOk,onMount,okLabel='Save'){
  const sc=document.createElement('div');sc.className='scrim';
  sc.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div><div class="modal-body">${body}</div>${onOk?`<div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>${okLabel}</button></div>`:''}</div>`;
  const close=()=>{sc.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};
  sc.addEventListener('click',e=>{if(e.target===sc||e.target.closest('[data-close]'))close()});
  document.addEventListener('keydown',k);document.body.appendChild(sc);
  if(onOk)sc.querySelector('[data-ok]').onclick=async()=>{const r=await onOk(sc);if(r!==false)close()};
  onMount&&onMount(sc);const f=sc.querySelector('input,textarea,select');f&&f.focus();return sc;
}
const TOPIC_OPTS=['RAG & Vector DBs','Embeddings','Prompt Engineering','LLM Evaluation','Transformers','Tokenization','LLM Basics','Assignments & Exams'];
function askQuestion(){modal('Ask anonymously',`<div class="field"><label for="qText">Your question</label><textarea class="input" id="qText" placeholder="e.g. How many chunks should we retrieve for the RAG assignment?"></textarea></div>
  <div class="field"><label for="qTopic">Topic</label><select class="input" id="qTopic">${TOPIC_OPTS.map(t=>`<option>${t}</option>`).join('')}</select></div>
  <p class="tiny muted">${ic('lock',13).replace('class="ic"','class="ic" style="display:inline;vertical-align:-2px"')} Your name is not attached to this question.</p>`,sc=>{
  const t=sc.querySelector('#qText').value.trim();if(t.length<8){toast('Write your question in a few more words');return false}
  const topic=sc.querySelector('#qTopic').value;
  S.qa.unshift({id:'q'+Date.now(),text:t,topic,at:new Date().toISOString(),votes:1,mine:true,voted:true,answer:null});
  S.topics[topic]=(S.topics[topic]||0)+1;
  S.activity.unshift({icon:'question',text:'New anonymous question in '+topic,at:new Date().toISOString()});
  save();UI.qaTab='mine';render();toast('Question posted anonymously')},null,'Post question')}
function reply(id){const q=S.qa.find(x=>x.id===id);modal('Reply to question',`<div class="page-block"><span class="tiny muted">Anonymous · ${esc(q.topic)}</span><p>${esc(q.text)}</p></div>
  <div class="field"><label for="rText">Your reply (visible to all students)</label><textarea class="input" id="rText"></textarea></div>
  ${SAMPLE?`<button class="btn sm" id="draftBtn" style="align-self:flex-start">${ic('spark',14)}Draft a reply from course materials</button>`:''}`,sc=>{
  const t=sc.querySelector('#rText').value.trim();if(!t){toast('Write a reply first');return false}
  q.answer=t;q.answeredAt=new Date().toISOString();S.activity.unshift({icon:'check',text:'You answered a question in '+q.topic,at:q.answeredAt});save();render();toast('Reply posted')},
  sc=>{const b=sc.querySelector('#draftBtn');if(b)b.onclick=async()=>{b.disabled=true;b.innerHTML='Drafting…';const hits=retrieve(q.text,3);const ta=sc.querySelector('#rText');
    try{await SAMPLE(`You are helping a university professor reply to an anonymous student question in the course "Generative AI". Using ONLY these course excerpts, draft a friendly, plain-text reply under 90 words that the professor can edit. Mention the slide file and page when useful. No greeting or sign-off.\n\n${hits.map(h=>`${h.file}, p. ${h.p}: ${h.text}`).join('\n')}\n\nStudent question: ${q.text}`,{modelTier:'quick',cache:false,onText:({text})=>{ta.value=text}})}catch(e){toast('Couldn\'t draft a reply right now. You can still write one.')}
    b.disabled=false;b.innerHTML=ic('spark',14)+'Draft again'}},'Post reply')}

function toolUpload(){modal('Upload materials',`<div class="field"><label for="uFile">File</label><input class="input" type="file" id="uFile" accept=".pdf,.txt,.md,.pptx,.docx,.mp4"></div>
  <div class="field"><label for="uTitle">Title</label><input class="input" id="uTitle" placeholder="e.g. Lecture Notes – Week 7: Hybrid Search"></div>
  <div class="field"><label for="uKind">Category</label><select class="input" id="uKind"><option value="upload">Lecture slides / notes</option><option value="update">Weekly update</option><option value="syllabus">Syllabus</option></select></div>
  <p class="tiny muted">Text files (.txt, .md) are split into chunks and become searchable by GENieAi straight away. Other file types are listed in the Library.</p>`,async sc=>{
  const f=sc.querySelector('#uFile').files[0];if(!f){toast('Choose a file to upload');return false}
  const title=sc.querySelector('#uTitle').value.trim()||f.name.replace(/\.[^.]+$/,'');
  const m={id:'up'+Date.now(),kind:sc.querySelector('#uKind').value,type:(f.name.split('.').pop()||'file').toUpperCase(),title,file:f.name,size:(f.size/1048576).toFixed(1)+' MB',date:new Date().toISOString().slice(0,10),week:COURSE.week};
  if(/\.(txt|md)$/i.test(f.name)){const text=(await f.text()).slice(0,60000);const paras=text.split(/\n\s*\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);const pages=[];let buf='';
    paras.forEach(p=>{if((buf+' '+p).length>700&&buf){pages.push(buf);buf=p}else buf=(buf?buf+' ':'')+p});if(buf)pages.push(buf);m.pages=pages.map((t,i)=>({p:i+1,t}))}
  S.uploads.push(m);S.activity.unshift({icon:'upload',text:`Uploaded “${title}”`,at:new Date().toISOString()});save();render();toast(m.pages?`Uploaded. GENieAi can now answer from ${m.pages.length} section${m.pages.length>1?'s':''} of this file.`:'Uploaded to the Library')},null,'Upload')}

function toolSummary(){
  const lectures=allMaterials().filter(m=>(m.kind==='slides'||m.kind==='upload')&&m.pages);
  modal('Generate class summary',`<div class="field"><label for="sSrc">Lecture material</label><select class="input" id="sSrc">${lectures.sort((a,b)=>(b.week||0)-(a.week||0)).map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join('')}</select></div>
   <button class="btn" id="genBtn" style="align-self:flex-start">${ic('spark',16)}Generate</button>
   <div id="sOut" class="page-block" style="display:none"></div>`,sc=>{
   const out=sc._result;if(!out){toast('Generate a summary first');return false}
   S.summaries=S.summaries.filter(s=>!(s.src===out.src));S.summaries.push(out);UI.openSummary=out.id;
   S.activity.unshift({icon:'spark',text:`Class summary (Week ${out.week}) published`,at:new Date().toISOString()});save();UI.view='summaries';location.hash='summaries';render();toast('Summary published to students')},
   sc=>{sc.querySelector('#genBtn').onclick=async()=>{
     const m=mat(sc.querySelector('#sSrc').value);const box=sc.querySelector('#sOut');const btn=sc.querySelector('#genBtn');btn.disabled=true;btn.textContent='Generating…';box.style.display='flex';
     const title=m.title.replace(/^.*?Week \d+:\s*/,'').replace(/^Lecture (Slides|Notes)\s*[–-]\s*/,'');
     let summary='',take=[];
     const show=()=>{box.innerHTML=`<span class="tiny muted">Preview · Week ${m.week||COURSE.week}: ${esc(title)}</span><p>${esc(summary)||'<span class="typing"><i></i><i></i><i></i></span>'}</p>${take.length?'<ul style="margin:0;padding-left:18px">'+take.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}`};show();
     const parse=txt=>{const s=txt.split(/TAKEAWAYS:/i);summary=s[0].replace(/^\s*SUMMARY:\s*/i,'').trim();take=(s[1]||'').split('\n').map(l=>l.replace(/^[-•*\d.)\s]+/,'').trim()).filter(Boolean)};
     if(SAMPLE){try{await SAMPLE(`Summarise this university lecture for students in the course "Generative AI". Use only the material below.\nReturn exactly this format and nothing else:\nSUMMARY: <one paragraph, 60-90 words, plain language>\nTAKEAWAYS:\n- <takeaway>\n- <takeaway>\n- <takeaway>\n\nLecture material:\n${m.pages.map(p=>`(p. ${p.p}) ${p.t}`).join('\n')}`,{modelTier:'quick',cache:false,onText:({text})=>{parse(text);show()}})}catch(e){SAMPLE_FAIL()}}
     else SAMPLE_FAIL();
     function SAMPLE_FAIL(){const sents=m.pages.map(p=>p.t.split(/(?<=\.)\s/)[0]);summary=sents.join(' ');take=m.pages.map(p=>{const s=p.t.split(/(?<=\.)\s/);return (s[1]||s[0]).slice(0,140)})}
     show();sc._result={id:'s'+Date.now(),week:m.week||COURSE.week,title,date:new Date().toISOString().slice(0,10),src:m.id,summary,take:take.slice(0,5)};
     btn.disabled=false;btn.innerHTML=ic('refresh',16)+'Regenerate';sc.querySelector('[data-ok]').disabled=false};
     sc.querySelector('[data-ok]').disabled=true},'Publish to students')}

/* ======================= events ======================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go],[data-libtab],[data-coursetab],[data-qatab],[data-atttab],[data-open],[data-src],[data-askabout],[data-suggest],[data-summary],[data-vote],[data-reply],[data-tool],[data-del],.nav a');
  if(UI.pop&&!e.target.closest('.pop')&&!(t&&t.dataset.act==='bell')){UI.pop=false;render();if(!t)return}
  if(!t)return;const d=t.dataset;
  if(t.matches('.nav a')){UI.sideOpen=false;return}
  if(d.act==='logout'){S.role=null;save();history.replaceState(null,'','#');render();return}
  if(d.act==='reset'){const role=S.role,name=S.name;S=freshState();S.role=role;S.name=name;save();render();toast('Demo data reset');return}
  if(d.act==='menu'){UI.sideOpen=!UI.sideOpen;render();return}
  if(d.act==='bell'){UI.pop=!UI.pop;S.seenBell=S.announcements.length+S.qa.filter(q=>q.mine&&q.answer).length;save();render();return}
  if(d.act==='newchat'){S.chat=[{role:'bot',text:'Hi! Ask me anything about Generative AI. I answer from your course slides, syllabus and weekly updates, and show where each answer came from.'}];save();render();return}
  if(d.act==='askq'){askQuestion();return}
  if(d.act==='newcode'){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';S.attendance.code=Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');save();render();return}
  if(d.go){location.hash=d.go;return}
  if(d.libtab){UI.libTab=d.libtab;render();return}
  if(d.coursetab){UI.courseTab=d.coursetab;render();return}
  if(d.qatab){UI.qaTab=d.qatab;render();return}
  if(d.atttab){UI.attTab=d.atttab;render();return}
  if(d.open){openMaterial(d.open);return}
  if(d.src){openMaterial(d.src,+d.page);return}
  if(d.askabout){const m=mat(d.askabout);location.hash='ask';setTimeout(()=>{const ta=document.getElementById('chatIn');if(ta){ta.value=`Explain the key ideas in "${m.title}"`;ta.focus()}},50);return}
  if(d.suggest){if(!UI.busy)ask(d.suggest);return}
  if(d.summary){UI.openSummary=UI.openSummary===d.summary?null:d.summary;render();return}
  if(d.vote){const q=S.qa.find(x=>x.id===d.vote);if(q&&!q.voted){q.votes++;q.voted=true;S.topics[q.topic]=(S.topics[q.topic]||0)+1;save();render()}return}
  if(d.reply){reply(d.reply);return}
  if(d.del){S.uploads=S.uploads.filter(m=>m.id!==d.del);S.extraVideos=S.extraVideos.filter(m=>m.id!==d.del);save();render();return}
  if(d.tool){({upload:toolUpload,summary:toolSummary,exam:toolExam,video:toolVideo,qa:()=>location.hash='qa',gaps:()=>location.hash='analytics'})[d.tool]();return}
});
function route(){const h=location.hash.slice(1);if(S.role&&NAV[S.role].find(n=>n[0]===h))UI.view=h;else if(S.role&&!h)UI.view='dashboard';UI.pop=false;render();const m=document.getElementById('main');if(m)m.scrollTop=0}
window.addEventListener('hashchange',route);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawWave,150)});
route();
</script>
</body>
